<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creation de formulaire et ces composants</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /*vh:viewport height -> hauteur visible */
            background-image: url('./Magnifique_fond_ecran_HD_-_Hiver.jpg');
            background-size: cover; /*couvre les espace vide du conteneur*/
            background-position: center; /*permet de centre l'image */
            background-repeat: no-repeat; /*fix l'image a une seul*/
            background-attachment: fixed; /*fix l'image sur le meme valeur meme à scroll*/
        }
        form{
            width: 500px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.5); /*couleur en red green blue avec alpha transparence*/
            border-radius: 20px; /*pour une bordure arrondi de 20 px*/
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); /*ombre portée*/
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px); /*flou de l'arrière plan*/
        }
        form h1, form p{
            text-align: center;
            color: #fff;
            margin-bottom: 25px;
        }
        form label {
            display: block; /*permet de donnée disposition de type block*/
            color: #fff;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"],form input[type="tel"],
        form input[type="date"] {
            width: 100%; /*Le champ prend toute la largeur disponible.*/
            padding: 12px;
            box-sizing: border-box; /*permet au champ de s'adapter à la taille du conteneur*/
            border: none;
            margin-bottom: 20px;
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }
        input::placeholder{
            color: #fff;
        }
        form button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #fff;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        form .checkbox {
            display: flex;
            align-items: center;
            color: #fff;
            margin-bottom: 20px;
            gap: 10px;
        }
        .checkbox input {
            width: 18px;
            height: 18px;
            margin: 0;
        }
        /*form:hover{
           backdrop-filter: blur(12px); /*flou de l'arrière plan*/
        /*   filter: blur(0px);
           transition: 0.5s;
        } */

        
    </style>
</head>

<body>
    <form action="">
        <h1>Inscription</h1>
        <p>Remplissez le formulaire ci-dessous pour vous inscrire.</p>

        <label for="nom">Nom Complet:</label>
        <input type="text" id="nom" name="nom" placeholder="Entrez votre nom complet" required>

        <label for="email">Adresse Email:</label>
        <input type="email" id="email" name="email" placeholder="Entrez votre adresse email" required>

        <label for="password">Mot de Passe:</label>
        <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required>

        <label for="confirmation">Confirmation du Mot de Passe:</label>
        <input type="password" id="confirmation" name="confirmation" placeholder="Confirmez votre mot de passe"
            required>

        <label for="telephone">Téléphone:</label>
        <input type="tel" id="telephone" name="telephone" placeholder="Entrez votre numéro de téléphone" required>

        <label for="date">Date de Naissance:</label>
        <input type="date" id="date" name="date" required>

        <label class="checkbox">
            <input type="checkbox" name="newsletter" value="oui">
            J'accepte les conditions d'utilisation.
        </label>
        <button type="submit">S'inscrire</button>
        <p>Déjà un compte ? <a href="#">Connectez-vous ici</a>.</p>
    </form>
</body>

</html>
